name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v0.6.5"
        required: true
        default: "v0.6.5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/liumusic-release.jks
          cat > android/keystore.properties <<EOF
          liumusicReleaseStoreFile=keystore/liumusic-release.jks
          liumusicReleaseStorePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          liumusicReleaseKeyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          liumusicReleaseKeyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --stacktrace -PliumusicReleaseIdSuffix=

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Rename artifact
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/LiuMusic-${VERSION}.apk"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiuMusic-release
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "LiuMusic ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            柳乐 LiuMusic 正式版
            作者：柳贯一 (LiuGuanYi) · 2676911574@qq.com
            签名：APK Signature Scheme v2 + v3
          files: out/*.apk
          draft: false
          prerelease: false

      - name: Cleanup keystore
        if: always()
        run: rm -rf android/keystore android/keystore.properties
